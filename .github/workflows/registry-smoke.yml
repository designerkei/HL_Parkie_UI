name: Parkie UI registry smoke

on:
  push:
    branches:
      - feat/parkie-ui-foundation-v0.1
  workflow_dispatch:
    inputs:
      run_rms_docker:
        description: Build the private Parkie-RMS consumer with RMS_REPO_TOKEN
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@designerkei'
          cache: npm

      - run: npm ci

      - name: Assign an immutable smoke version
        id: version
        shell: bash
        run: |
          package_version="0.0.0-registry-smoke.${GITHUB_RUN_NUMBER}"
          npm version "$package_version" --workspace @designerkei/parkie-ui --no-git-tag-version
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Publish the smoke package
        run: npm publish --workspace @designerkei/parkie-ui --tag registry-smoke
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install from the registry in a clean consumer
        timeout-minutes: 3
        shell: bash
        run: |
          consumer_dir="$(mktemp -d)"
          cd "$consumer_dir"
          printf '@designerkei:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          npm init --yes
          npm install "@designerkei/parkie-ui@${PACKAGE_VERSION}" --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "import('@designerkei/parkie-ui').then(({ parkieUiRegistrySmoke: value }) => { if (!value.ready) process.exit(1); console.log(value); })"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rms-docker:
    if: ${{ github.event_name == 'push' || inputs.run_rms_docker }}
    needs: publish-and-install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACKAGE_VERSION: ${{ needs.publish-and-install.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@designerkei'

      - name: Check out the private RMS consumer branch
        uses: actions/checkout@v4
        with:
          repository: designerkei/Parkie-RMS
          ref: feature/local-mock-backend
          path: rms
          token: ${{ secrets.RMS_REPO_TOKEN }}
          persist-credentials: false

      - name: Pin the published package in the disposable RMS lockfile
        working-directory: rms
        run: |
          printf '@designerkei:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          npm install "@designerkei/parkie-ui@${PACKAGE_VERSION}" --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          rm -f .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RMS in Node 20 with registry credentials mounted as a secret
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npmrc_file="${RUNNER_TEMP}/parkie-ui.npmrc"
          umask 077
          printf '@designerkei:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$npmrc_file"
          docker build \
            --secret "id=npmrc,src=$npmrc_file" \
            --file tests/registry-smoke/RmsDockerfile \
            rms
          rm -f "$npmrc_file"
